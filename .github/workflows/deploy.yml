name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  GITHUB_SHA_SHORT: ${{ github.sha }}

jobs:
  bootstrap:
    name: Bootstrap Azure infrastructure if required
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    defaults:
      run:
        working-directory: infra/environments/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Detect existing environment
        id: detect
        run: |
          RG=$(az group list --query "[?name=='vexarfleet-${{ env.ENVIRONMENT }}-rg'].name | [0]" -o tsv)
          echo "exists=$([[ -n "$RG" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Initialize Terraform
        run: terraform init

      - name: Create baseline infrastructure
        if: steps.detect.outputs.exists != 'true'
        env:
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
          TF_VAR_db_app_password: ${{ secrets.DB_APP_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_image: "mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
        run: terraform apply -auto-approve

  build:
    name: Build and scan image
    needs: bootstrap
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR
        id: acr
        run: |
          ACR=$(az acr list --query "[?tags.workload=='fleet-ping'].name | [0]" -o tsv)
          test -n "$ACR"
          echo "name=$ACR" >> "$GITHUB_OUTPUT"
          echo "login_server=$(az acr show -n "$ACR" --query loginServer -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm test

      - name: Build immutable image
        id: meta
        env:
          REGISTRY: ${{ steps.acr.outputs.login_server }}
        run: |
          IMAGE="$REGISTRY/fleet-ping:${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push immutable image
        run: docker push "${{ steps.meta.outputs.image }}"

  terraform:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    defaults:
      run:
        working-directory: infra/environments/${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
      TF_VAR_db_app_password: ${{ secrets.DB_APP_PASSWORD }}
      TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
      TF_VAR_image: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        run: |
          terraform init             -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"             -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"             -backend-config="container_name=tfstate"             -backend-config="key=vexarfleet-${{ inputs.environment || github.ref_name }}.tfstate"             -backend-config="use_azuread_auth=true"
      - run: terraform fmt -check -recursive ../..
      - run: terraform validate
      - run: terraform plan
      - run: terraform apply -auto-approve

  migrate:
    needs: terraform
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run migration job
        run: |
          RG="vexarfleet-${{ env.ENVIRONMENT }}-rg"
          JOB=$(az containerapp job list -g "$RG" --query "[?contains(name, 'migration')].name | [0]" -o tsv)
          az containerapp job start -g "$RG" --name "$JOB"

      - name: Wait for migration completion
        run: |
          RG="vexarfleet-${{ env.ENVIRONMENT }}-rg"
          JOB=$(az containerapp job list -g "$RG" --query "[?contains(name, 'migration')].name | [0]" -o tsv)
          for i in {1..30}; do
            STATUS=$(az containerapp job execution list -g "$RG" -n "$JOB" \
              --query "[0].properties.status" -o tsv)
            echo "Migration status: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Degraded) exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration timed out"
          exit 1

  verify:
    needs: [build, terraform, migrate]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify revision and health
        run: |
          RG="vexarfleet-${{ env.ENVIRONMENT }}-rg"
          APP=$(az containerapp list -g "$RG" --query "[?contains(name, '-api')].name | [0]" -o tsv)
          FQDN=$(az containerapp show -g "$RG" -n "$APP" --query "properties.configuration.ingress.fqdn" -o tsv)
          REV=$(az containerapp revision list -g "$RG" -n "$APP" \
            --query "[?properties.trafficWeight==100].name | [0]" -o tsv)
          echo "Active revision: $REV"
          for i in {1..18}; do
            if curl --fail --silent --show-error "https://$FQDN/healthz"; then
              curl --fail --silent --show-error "https://$FQDN/readyz"
              exit 0
            fi
            sleep 10
          done
          exit 1

  rollback:
    if: failure()
    needs: [build, terraform, migrate, verify]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Roll back traffic to previous healthy revision
        run: |
          RG="vexarfleet-${{ env.ENVIRONMENT }}-rg"
          APP=$(az containerapp list -g "$RG" --query "[?contains(name, '-api')].name | [0]" -o tsv)
          PREV=$(az containerapp revision list -g "$RG" -n "$APP" \
            --query "[?properties.active==true && properties.trafficWeight==100 && !contains(name, '${GITHUB_SHA:0:12}')].name | [0]" -o tsv)
          if [ -n "$PREV" ] && [ "$PREV" != "null" ]; then
            az containerapp ingress traffic set -g "$RG" -n "$APP" --revision-weight "$PREV=100"
            echo "Rolled back to $PREV"
          else
            echo "No previous revision found"
          fi
