services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://appuser:localdevpassword@db:5432/vexar_fleet
      DB_SSL: "false"
      JWT_SECRET: local-development-only-change-me
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: vexar_fleet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d vexar_fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
