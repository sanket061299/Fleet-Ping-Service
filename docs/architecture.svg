<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<style>
.box{fill:#fff;stroke:#222;stroke-width:2;rx:12}.title{font:700 20px sans-serif}.text{font:16px sans-serif}.small{font:14px sans-serif}.line{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#333"/></marker></defs>
<rect x="40" y="50" width="210" height="90" class="box"/><text x="145" y="88" text-anchor="middle" class="title">Vehicles / Drivers</text><text x="145" y="115" text-anchor="middle" class="text">HTTPS API clients</text>
<rect x="320" y="40" width="250" height="110" class="box"/><text x="445" y="78" text-anchor="middle" class="title">GitHub Actions</text><text x="445" y="105" text-anchor="middle" class="text">Test • Scan • Build</text><text x="445" y="130" text-anchor="middle" class="text">Terraform • Deploy</text>
<rect x="640" y="40" width="250" height="110" class="box"/><text x="765" y="78" text-anchor="middle" class="title">Azure Container Registry</text><text x="765" y="108" text-anchor="middle" class="text">Immutable SHA images</text>
<rect x="950" y="40" width="250" height="110" class="box"/><text x="1075" y="78" text-anchor="middle" class="title">OIDC / Managed Identity</text><text x="1075" y="108" text-anchor="middle" class="text">No long-lived Azure secret</text>
<rect x="300" y="240" width="900" height="540" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="8 8" rx="18"/>
<text x="330" y="275" class="title">Azure VNet / Production Boundary</text>
<rect x="350" y="320" width="330" height="180" class="box"/><text x="515" y="360" text-anchor="middle" class="title">Azure Container Apps</text><text x="515" y="390" text-anchor="middle" class="text">Public HTTPS ingress</text><text x="515" y="420" text-anchor="middle" class="text">Health + readiness</text><text x="515" y="450" text-anchor="middle" class="text">Autoscaling + revisions</text><text x="515" y="480" text-anchor="middle" class="text">Runtime managed identity</text>
<rect x="800" y="320" width="330" height="180" class="box"/><text x="965" y="360" text-anchor="middle" class="title">PostgreSQL Flexible Server</text><text x="965" y="390" text-anchor="middle" class="text">Private VNet access</text><text x="965" y="420" text-anchor="middle" class="text">Backups + PITR</text><text x="965" y="450" text-anchor="middle" class="text">Connection pooling</text><text x="965" y="480" text-anchor="middle" class="text">Least-privilege app role</text>
<rect x="350" y="560" width="330" height="150" class="box"/><text x="515" y="600" text-anchor="middle" class="title">Azure Key Vault</text><text x="515" y="630" text-anchor="middle" class="text">JWT / DB secrets</text><text x="515" y="660" text-anchor="middle" class="text">Azure RBAC</text><text x="515" y="690" text-anchor="middle" class="text">Managed identity access</text>
<rect x="800" y="560" width="330" height="150" class="box"/><text x="965" y="600" text-anchor="middle" class="title">Azure Monitor</text><text x="965" y="630" text-anchor="middle" class="text">Log Analytics</text><text x="965" y="660" text-anchor="middle" class="text">Metrics + alerts</text><text x="965" y="690" text-anchor="middle" class="text">Operational dashboards</text>
